name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Maintenance LTS + Active LTS. Node 20 was dropped after it reached
        # end-of-life in April 2026; testing an unsupported runtime told us
        # nothing while delaying every PR.
        # Floor note: Jest 30 needs os.availableParallelism(), so the test suite
        # cannot run below Node 20 even though the library itself supports 18+.
        node-version: [22.x, 24.x]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run TypeScript build
        run: npm run build
        
      - name: Run tests
        run: npm test
        env:
          CI: true

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check TypeScript compilation
        run: npm run build
        
      - name: Run ESLint (if available)
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found, skipping ESLint check"
          fi
        continue-on-error: false
        
      - name: Check Prettier formatting (if available)
        run: |
          if npm run | grep -q "format:check"; then
            npm run format:check
          elif npx prettier --version 2>/dev/null; then
            npx prettier --check "src/**/*.{ts,js,json}" || echo "Prettier not configured, skipping format check"
          else
            echo "Prettier not available, skipping format check"
          fi
        continue-on-error: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  test-electron-compatibility:
    name: Test Electron Compatibility
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # One entry per major: the peerDependency floor, the version developed
        # against, and current latest. Testing several patches inside a major
        # buys nothing here — see the note on the build step below.
        electron-version: [25.x, 39.x, 43.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install specific Electron version
        # --ignore-scripts skips the postinstall binary download. Nothing in
        # this job executes Electron; only its bundled electron.d.ts is needed.
        run: npm install --save-dev --ignore-scripts electron@${{ matrix.electron-version }}

      # This is the step that actually exercises the matrix: it typechecks src/
      # against this Electron version's electron.d.ts, catching drift in the
      # safeStorage / ipcMain / ipcRenderer signatures the library depends on.
      - name: Run TypeScript build
        run: npm run build

      # Note: the suite mocks the electron module wholesale, so this re-runs the
      # same assertions on every matrix leg. Kept as a regression guard that the
      # swapped dependency has not disturbed the build output.
      - name: Run tests with specific Electron version
        run: npm test
        env:
          CI: true

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build package
        run: npm run build
        
      - name: Check package exports
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            
            // Check main export
            if (!fs.existsSync(pkg.main)) {
              console.error('Main export file missing:', pkg.main);
              process.exit(1);
            }
            
            // Check types export
            if (!fs.existsSync(pkg.types)) {
              console.error('Types export file missing:', pkg.types);
              process.exit(1);
            }
            
            // Check named exports
            for (const [name, config] of Object.entries(pkg.exports)) {
              if (typeof config === 'object') {
                if (config.import && !fs.existsSync(config.import)) {
                  console.error('Export import missing for', name, ':', config.import);
                  process.exit(1);
                }
                if (config.types && !fs.existsSync(config.types)) {
                  console.error('Export types missing for', name, ':', config.types);
                  process.exit(1);
                }
              }
            }
            
            console.log('✅ All package exports are valid');
          "
          
      - name: Test package installation
        run: |
          # Create a temporary directory and test local installation
          mkdir -p /tmp/test-install
          cd /tmp/test-install
          npm init -y
          npm install ${{ github.workspace }}
          
          # Test that the package can be imported
          node -e "
            try {
              const main = require('genai-key-storage-lite');
              const renderer = require('genai-key-storage-lite/renderer');
              const preload = require('genai-key-storage-lite/preload');
              console.log('✅ Package imports work correctly');
            } catch (error) {
              console.error('❌ Package import failed:', error.message);
              process.exit(1);
            }
          "

          # And that it can be imported from ESM. The require() check above
          # passed for months while `import` failed outright with
          # ERR_PACKAGE_PATH_NOT_EXPORTED, because package.json declared no
          # `import` condition. Testing only one module system hid that
          # completely — assert named exports actually resolve, since a default
          # -only import would still succeed while breaking every real consumer.
          node --input-type=module -e "
            import { ApiKeyServiceMain } from 'genai-key-storage-lite';
            import { ApiKeyServiceRenderer } from 'genai-key-storage-lite/renderer';
            import { createApiKeyManagerBridge } from 'genai-key-storage-lite/preload';
            import { ApiKeyStorageError } from 'genai-key-storage-lite/common';
            const named = { ApiKeyServiceMain, ApiKeyServiceRenderer, createApiKeyManagerBridge, ApiKeyStorageError };
            for (const [name, value] of Object.entries(named)) {
              if (typeof value !== 'function') {
                console.error('❌ ESM named export missing or wrong type:', name, typeof value);
                process.exit(1);
              }
            }
            console.log('✅ ESM imports work correctly');
          "

  # This job is the single required status check in branch protection on main.
  # Keep the name "Build and Test" stable — renaming it silently disables the
  # gate, because branch protection matches required checks by name.
  #
  # It previously depended on [test] alone, which left lint, package validation
  # and Electron compatibility ungated: a PR breaking any of them could merge.
  # It now aggregates every job whose failure should block a merge.
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [test, lint-and-format, test-electron-compatibility, package-validation]
    if: always()
    steps:
      - name: Check upstream job results
        run: |
          status=0
          check() {
            if [[ "$2" != "success" ]]; then
              echo "FAILED: $1 ($2)"
              status=1
            else
              echo "ok: $1"
            fi
          }
          check "test"                       "${{ needs.test.result }}"
          check "lint-and-format"            "${{ needs.lint-and-format.result }}"
          check "test-electron-compatibility" "${{ needs.test-electron-compatibility.result }}"
          check "package-validation"         "${{ needs.package-validation.result }}"
          exit $status

  results-summary:
    name: Results Summary
    runs-on: ubuntu-latest
    needs: [test, lint-and-format, security-audit, test-electron-compatibility, package-validation]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          
          # Test results
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ **Tests**: All tests passed across all OS and Node.js versions" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Lint results
          if [[ "${{ needs.lint-and-format.result }}" == "success" ]]; then
            echo "✅ **Lint & Format**: Code quality checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lint & Format**: Code quality issues found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security results
          if [[ "${{ needs.security-audit.result }}" == "success" ]]; then
            echo "✅ **Security**: No security issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Security**: Security audit completed with warnings" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Electron compatibility results  
          if [[ "${{ needs.test-electron-compatibility.result }}" == "success" ]]; then
            echo "✅ **Electron Compatibility**: Compatible with all tested Electron versions" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Electron Compatibility**: Some Electron version compatibility issues found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Package validation results
          if [[ "${{ needs.package-validation.result }}" == "success" ]]; then
            echo "✅ **Package Validation**: Package structure and exports are valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Package Validation**: Package validation failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Matrix Coverage:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Operating Systems**: Ubuntu, Windows, macOS" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Versions**: 22.x, 24.x" >> $GITHUB_STEP_SUMMARY
          echo "- **Electron Versions**: 25.x (peer floor), 39.x (dev target), 43.x (latest)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Test Combinations**: 19 (6 OS/Node + 9 OS/Electron + 4 validation jobs)" >> $GITHUB_STEP_SUMMARY
          
      - name: Set final status
        if: needs.test.result != 'success' || needs.lint-and-format.result != 'success' || needs.package-validation.result != 'success'
        run: |
          echo "❌ CI failed - check individual job results for details"
          exit 1