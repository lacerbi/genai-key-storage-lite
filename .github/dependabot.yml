version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    reviewers:
      - "@maintainers"
    assignees:
      - "@maintainers"
    labels:
      - "dependencies"
      - "automated"
    # Group development dependencies together
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "jest"
          - "ts-jest"
        update-types:
          - "minor"
          - "patch"
      # Group Electron updates separately due to potential breaking changes
      electron:
        patterns:
          - "electron"
        update-types:
          - "minor"
    # Ignore specific updates if needed
    ignore:
      # Ignore major version updates for Electron (require manual review)
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  # Enable security updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Without this, the limit defaults to 5. Once five action PRs are open,
    # Dependabot cannot open replacements, so stale PRs pin themselves to
    # versions that are superseded while newer majors go unreported.
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
    # Ship all action updates as a single PR so the queue cannot saturate.
    groups:
      github-actions:
        patterns:
          - "*"
